<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maze keyboard controls</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: transparent; }
      #maze {
        display: grid; gap: 2px; padding: 5px; margin: 0 auto;
        width: min(100%, 420px); border-radius: 14px; background: #94a3b8;
      }
      .cell {
        min-width: 0; min-height: 0; border-radius: 3px; background: #f8fafc;
        transition: background .08s linear, transform .08s ease, box-shadow .08s ease;
      }
      .wall { background: #1f2937; }
      .human-path { background: #c084fc; }
      .start { background: #22c55e; }
      .goal { background: #ef4444; }
      .current {
        background: #fb923c; transform: scale(.82);
        box-shadow: 0 0 0 3px rgba(249,115,22,.42);
      }
    </style>
  </head>
  <body>
    <div id="maze" aria-label="Human maze"></div>
    <script>
      const movementKeys = new Set([
        "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
        "w", "a", "s", "d"
      ]);
      const BATCH_WINDOW_MS = 45;
      const directions = {
        ArrowUp: [-1, 0], w: [-1, 0],
        ArrowDown: [1, 0], s: [1, 0],
        ArrowLeft: [0, -1], a: [0, -1],
        ArrowRight: [0, 1], d: [0, 1]
      };
      const mazeElement = document.getElementById("maze");
      let preview = null;

      const cellKey = ([row, col]) => `${row}-${col}`;

      function applyPreviewMove(key) {
        if (!preview || !preview.enabled) return;
        const direction = directions[key];
        if (!direction) return;
        const current = preview.path[preview.path.length - 1] || preview.start;
        const target = [current[0] + direction[0], current[1] + direction[1]];
        const inside = target[0] >= 0 && target[0] < preview.rows &&
          target[1] >= 0 && target[1] < preview.cols;
        if (!inside || preview.walls.has(cellKey(target))) return;
        preview.path.push(target);
        paintMaze();
      }

      function paintMaze() {
        if (!preview) return;
        const path = new Set(preview.path.map(cellKey));
        const current = cellKey(preview.path[preview.path.length - 1] || preview.start);
        for (const [id, cell] of preview.cells) {
          cell.className = "cell";
          if (preview.walls.has(id)) cell.classList.add("wall");
          if (path.has(id)) cell.classList.add("human-path");
          if (id === cellKey(preview.start)) cell.classList.add("start");
          if (id === cellKey(preview.goal)) cell.classList.add("goal");
          if (id === current && id !== cellKey(preview.start) && id !== cellKey(preview.goal)) {
            cell.classList.add("current");
          }
        }
      }

      function renderMaze(state, pendingEvents) {
        if (!state || !state.maze) return;
        const maze = state.maze;
        mazeElement.innerHTML = "";
        mazeElement.style.gridTemplateColumns = `repeat(${maze.cols}, 1fr)`;
        mazeElement.style.aspectRatio = `${maze.cols} / ${maze.rows}`;
        const cells = new Map();
        for (let row = 0; row < maze.rows; row++) {
          for (let col = 0; col < maze.cols; col++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.style.aspectRatio = "1";
            mazeElement.appendChild(cell);
            cells.set(`${row}-${col}`, cell);
          }
        }
        preview = {
          enabled: Boolean(state.enabled), rows: maze.rows, cols: maze.cols,
          start: maze.start, goal: maze.goal, walls: new Set(maze.walls.map(cellKey)),
          path: (state.path && state.path.length ? state.path : [maze.start]).map(cell => [...cell]),
          cells
        };
        for (const item of pendingEvents) applyPreviewMove(item.key);
        paintMaze();
        send("streamlit:setFrameHeight", { height: Math.ceil(mazeElement.getBoundingClientRect().height) + 2 });
      }

      function send(type, extra = {}) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type, ...extra }, "*"
        );
      }

      function isTextInput(target) {
        const tag = (target && target.tagName || "").toLowerCase();
        return tag === "input" || tag === "textarea" || tag === "select" ||
          Boolean(target && target.isContentEditable);
      }

      function humanTabIsVisible() {
        try {
          return window.frameElement && window.frameElement.offsetParent !== null;
        } catch (_) {
          return true;
        }
      }

      function installController(targetWindow, sharedController = null) {
        try {
          const targetDocument = targetWindow.document;

          // The controller lives on the parent window, so its queue survives
          // destruction/recreation of this iframe during Streamlit reruns.
          const controller = sharedController || targetWindow.__mazeKeyboardController || {
            version: 2,
            active: false,
            history: [],
            pressed: new Set(),
            timer: null,
            sender: null,
            visible: () => true,
            sequence: 0,
            batchSequence: 0,
            attempt: null
          };
          targetWindow.__mazeKeyboardController = controller;

          controller.flush = function () {
            if (!this.active || !this.history.length || !this.sender) return;
            // Send cumulative numbered history. If Streamlit coalesces several
            // component values during a rerun, the newest value still carries
            // every earlier press and Python can process only unseen numbers.
            this.sender({
              events: this.history.slice(),
              attempt: this.attempt,
              id: `batch-${Date.now()}-${++this.batchSequence}`
            });
          };
          controller.schedule = function () {
            if (!this.active || this.timer || !this.history.length) return;
            this.timer = targetWindow.setTimeout(() => {
              this.timer = null;
              this.flush();
            }, BATCH_WINDOW_MS);
          };

          function onKeyDown(event) {
            const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
            if (!controller.active || !controller.visible() || !movementKeys.has(key) ||
                isTextInput(event.target)) {
              return;
            }
            event.preventDefault();

            // Ignore OS key-repeat and duplicate keydown events until keyup.
            // Separate fast presses still work because each has its own keyup.
            if (event.repeat || controller.pressed.has(key)) return;
            controller.pressed.add(key);
            if (controller.previewMove) controller.previewMove(key);
            controller.history.push({ sequence: ++controller.sequence, key });
            controller.schedule();
          }

          function onKeyUp(event) {
            const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
            controller.pressed.delete(key);
          }

          if (targetWindow.__mazeKeyboardHandler) {
            targetDocument.removeEventListener(
              "keydown", targetWindow.__mazeKeyboardHandler, true
            );
          }
          if (targetWindow.__mazeKeyboardKeyupHandler) {
            targetDocument.removeEventListener(
              "keyup", targetWindow.__mazeKeyboardKeyupHandler, true
            );
          }
          targetWindow.__mazeKeyboardHandler = onKeyDown;
          targetWindow.__mazeKeyboardKeyupHandler = onKeyUp;
          targetDocument.addEventListener("keydown", onKeyDown, true);
          targetDocument.addEventListener("keyup", onKeyUp, true);
          return controller;
        } catch (_) {
          // Cross-origin parents are skipped; the component document is the fallback.
          return null;
        }
      }

      const parentController = installController(window.parent);
      if (window.top !== window.parent) {
        installController(window.top, parentController);
      }
      const primaryController = parentController || installController(window);
      installController(window, primaryController);
      const controllers = primaryController ? [primaryController] : [];

      function sendBatch(value) {
        send("streamlit:setComponentValue", { value, dataType: "json" });
      }

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") return;
        const activeArg = event.data.args && event.data.args.active;
        // The object form keeps the original single Python argument, making
        // rolling Streamlit deployments compatible with the previous helper.
        const isActive = typeof activeArg === "object"
          ? Boolean(activeArg && activeArg.enabled)
          : Boolean(activeArg);
        const attempt = typeof activeArg === "object" && activeArg
          ? activeArg.attempt
          : 0;
        for (const controller of controllers) {
          if (controller.attempt !== attempt) {
            controller.attempt = attempt;
            controller.history.length = 0;
            controller.sequence = 0;
            controller.batchSequence = 0;
          }
          controller.active = isActive;
          controller.sender = sendBatch;
          controller.previewMove = applyPreviewMove;
          controller.lastVisible = humanTabIsVisible();
          controller.visible = () => {
            try {
              const frame = window.frameElement;
              // Keep the last visibility value during the short iframe swap
              // of a rerun, then refresh it once the new frame is connected.
              if (frame && frame.isConnected) {
                controller.lastVisible = frame.offsetParent !== null;
              }
              return controller.lastVisible;
            } catch (_) {
              return true;
            }
          };

          if (!isActive) {
            controller.history.length = 0;
            controller.pressed.clear();
            if (controller.timer) clearTimeout(controller.timer);
            controller.timer = null;
          }

          const acknowledged = Number(activeArg && activeArg.acknowledged || 0);
          const pending = controller.history.filter(item => item.sequence > acknowledged);
          renderMaze(activeArg, pending);
        }
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 360 });
    </script>
  </body>
</html>
